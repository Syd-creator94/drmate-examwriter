fitting_guidance:
  initial_trial:
    parameters:
      base_curve_mm: "8.7"
      diameter_mm: "15.0"
    rationale: "Use the average diagnostic lens first because central keratometry has limited value for choosing the initial PRS lens."
    instructions:
      - "Allow the diagnostic lens to settle for a few minutes before the initial evaluation."
      - "If there is no obvious edge lift, allow up to an additional 30 minutes of settling."
      - "If edge lift or decentration indicates a flat relationship, evaluate the next steeper base curve."
      - "Use the push-up test after confirming good centration."
    evidence:
      - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
        locator: "page 1, Basic Fitting Information and Push Up Test"

  reference_tables:
    - table_id: "post_op_k_to_published_lens_range"
      measurement: "post_op_k_d"
      measurement_unit: "D"
      purpose: "reference_mapping"
      interpretation: "Reference mapping of post-operative K ranges to published BC/DIA ranges; not an algorithm for selecting the first diagnostic lens."
      rows:
        - label: "37.75 D or flatter"
          measurement_minimum: null
          measurement_maximum: "37.75"
          lens_parameters:
            base_curve_mm: "9.0"
            diameter_mm: "15.0"
        - label: "38.00 D to 41.00 D"
          measurement_minimum: "38.00"
          measurement_maximum: "41.00"
          lens_parameters:
            base_curve_mm: "8.7"
            diameter_mm: "15.0"
        - label: "41.25 D or steeper"
          measurement_minimum: "41.25"
          measurement_maximum: null
          lens_parameters:
            base_curve_mm: "8.4"
            diameter_mm: "15.0"
      evidence:
        - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
          locator: "page 1, Post-Op K's Range table"

    - table_id: "pre_op_k_to_published_lens_range"
      measurement: "pre_op_k_d"
      measurement_unit: "D"
      purpose: "reference_mapping"
      interpretation: "Reference mapping of pre-operative K ranges to published BC/DIA ranges; not an algorithm for selecting the first diagnostic lens."
      rows:
        - label: "41.75 D or flatter"
          measurement_minimum: null
          measurement_maximum: "41.75"
          lens_parameters:
            base_curve_mm: "9.0"
            diameter_mm: "15.0"
        - label: "42.00 D to 45.00 D"
          measurement_minimum: "42.00"
          measurement_maximum: "45.00"
          lens_parameters:
            base_curve_mm: "8.7"
            diameter_mm: "15.0"
        - label: "45.25 D or steeper"
          measurement_minimum: "45.25"
          measurement_maximum: null
          lens_parameters:
            base_curve_mm: "8.4"
            diameter_mm: "15.0"
      evidence:
        - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
          locator: "page 1, Pre-Op K's Range table"

  fit_criteria:
    - criterion_id: "limbal_draping"
      field: "observations.limbal_draping_mm"
      accepted_range:
        minimum: "1.0"
        maximum: "1.5"
        step: null
        unit: "mm"
      accepted_value: null
      description: "The centered lens should drape 1.0 to 1.5 mm beyond the limbus."
      evidence:
        - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
          locator: "page 1, Lens Fitting Evaluation"
    - criterion_id: "movement_primary_blink"
      field: "observations.movement_mm"
      accepted_range:
        minimum: "0.25"
        maximum: "0.50"
        step: null
        unit: "mm"
      accepted_value: null
      description: "Movement in primary position with a normal blink should be 0.25 to 0.50 mm."
      evidence:
        - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
          locator: "page 1, Lens Fitting Evaluation"
    - criterion_id: "visual_acuity_difference"
      field: "observations.va_lines_from_best_corrected"
      accepted_range:
        minimum: "0"
        maximum: "2"
        step: "1"
        unit: "lines"
      accepted_value: null
      description: "Visual acuity should remain within two lines of best corrected vision."
      evidence:
        - source_revision_id: "xcel.flexlens-prs.basic-fitting.2014-09-17"
          locator: "page 1, Lens Fitting Evaluation"

clinical_review_notes:
  - "USER_CONFIRMED 2026-07-28: start with the average 8.7/15.0 diagnostic lens and evaluate fit and refraction."

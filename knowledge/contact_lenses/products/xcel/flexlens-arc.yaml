design_facts:
  - fact_id: "standard_back_surface_enhanced_center"
    text: "ARC uses a standard back-surface fitting curve and enhanced center thickness to stabilize correction over an aberrated cornea."
    evidence:
      - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
        locator: "page 3, design description"
  - fact_id: "toric_when_residual_astigmatism"
    text: "A toric design is needed when residual astigmatism is detected through over-refraction."
    evidence:
      - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
        locator: "page 3, design description"


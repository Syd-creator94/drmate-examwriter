fitting_guidance:
  initial_trial:
    parameters: {}
    rationale: "The first diagnostic lens depends on Flat K and requested cylinder; no single universal ARC starting lens is published."
    instructions:
      - "Use the diagnostic fitting set."
      - "For Flat K equal to or flatter than 49.00 D, start with base curve 8.3 mm."
      - "For Flat K steeper than 49.12 D, start with base curve 7.7 mm."
      - "For cylinder magnitude up to 2.00 D, start with 0.30 mm center thickness; over 2.00 D, start with 0.50 mm."
      - "Evaluate as a normal soft lens and allow 10 minutes of settling before rotation, edge, and acuity evaluation."
    evidence:
      - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
        locator: "pages 4-5, Fitting the Flexlens ARC"
  reference_tables:
    - table_id: "flat_k_to_initial_base_curve"
      measurement: "flat_k_d"
      measurement_unit: "D"
      purpose: "reference_mapping"
      interpretation: "Manufacturer starting-base-curve mapping; the interval between 49.00 D and 49.12 D is not filled by inference."
      rows:
        - label: "49.00 D or flatter"
          measurement_minimum: null
          measurement_maximum: "49.00"
          lens_parameters:
            base_curve_mm: "8.3"
        - label: "49.12 D or steeper"
          measurement_minimum: "49.12"
          measurement_maximum: null
          lens_parameters:
            base_curve_mm: "7.7"
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 5, Base Curve Selection"
  fit_criteria:
    - criterion_id: "centered"
      field: "observations.centered"
      accepted_range: null
      accepted_value: true
      description: "The diagnostic lens should be well centered."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 1"
    - criterion_id: "movement"
      field: "observations.movement_mm"
      accepted_range:
        minimum: "0"
        maximum: "2.0"
        unit: "mm"
      accepted_value: null
      description: "The centered lens should show no more than 2 mm movement."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 1"
    - criterion_id: "no_central_air_bubble"
      field: "observations.central_air_bubble"
      accepted_range: null
      accepted_value: false
      description: "The lens should show slight central touch without an air bubble."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 2"
    - criterion_id: "no_lens_fold"
      field: "observations.lens_fold"
      accepted_range: null
      accepted_value: false
      description: "The lens should show slight central touch without a fold."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 2"
    - criterion_id: "slight_central_touch"
      field: "observations.central_touch"
      accepted_range: null
      accepted_value: "slight"
      description: "The lens should display slight central touch."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 2"
    - criterion_id: "rotation"
      field: "observations.rotation_deg"
      accepted_range:
        minimum: "0"
        maximum: "10"
        unit: "degree"
      accepted_value: null
      description: "Rotation over 10 degrees requires the next steeper base curve."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 4"
    - criterion_id: "over_refraction_va"
      field: "observations.over_refraction_va_at_least_best_achievable"
      accepted_range: null
      accepted_value: true
      description: "Sphere-cylinder over-refraction acuity should be at least equal to best achievable acuity."
      evidence:
        - source_revision_id: "xcel.flexlens-arc.fitting-guide.rev-10-2017"
          locator: "page 6, fitting evaluation step 6"

clinical_review_notes:
  - "The manufacturer requests that all fitting evaluation information be provided to an X-Cel consultant for the final lens order."
  - "Extended parameter ranges require X-Cel consultation and are not represented as routinely available."

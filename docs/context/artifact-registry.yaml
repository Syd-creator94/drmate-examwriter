schema_version: "1.0"

artifacts:
  - id: "project-context"
    path: "project-context.yaml"
    title: "Project context"
    authority: "Explicit accepted user decisions"
    status: "active"
    update_policy: "Update after accepted project governance, scope, risk, or source-of-truth changes"
    triggers:
      - "accepted project direction change"
      - "canonical artifact set change"
    dependencies: []
    verification: "YAML parse and consistency review against registered artifacts"
    required_when: "Always"

  - id: "project-overview"
    path: "docs/project/overview.md"
    title: "Dr. Mate project overview"
    authority: "Accepted intended direction plus repository evidence"
    status: "active"
    update_policy: "Update when accepted scope or verified system boundaries change"
    triggers:
      - "accepted product scope change"
      - "verified architecture boundary change"
    dependencies:
      - "project-context"
    verification: "Review intent claims against decisions and implementation claims against repository evidence"
    required_when: "Always"

  - id: "project-status"
    path: "docs/project/status.md"
    title: "Current implementation status"
    authority: "Repository code, tests, configuration, and explicit accepted decisions"
    status: "active"
    update_policy: "Update after verified implementation or validation state changes"
    triggers:
      - "implementation change"
      - "test or verification result"
      - "new blocker or unknown"
    dependencies:
      - "project-context"
      - "contact-lens-feature"
      - "adr-0001-contact-lens-knowledge"
      - "adr-0002-knowledge-private-runtime"
      - "clinical-platform-foundation"
    verification: "Repository inspection and recorded validation commands"
    required_when: "During implementation"

  - id: "contact-lens-feature"
    path: "docs/features/contact-lens-knowledge-base.md"
    title: "Contact-lens knowledge base and candidate matching"
    authority: "Accepted product behavior and clinical safety constraints"
    status: "active"
    update_policy: "Update after accepted workflow, requirement, or safety-boundary changes"
    triggers:
      - "contact-lens feature scope change"
      - "matching behavior change"
      - "clinical review decision"
    dependencies:
      - "project-context"
      - "adr-0001-contact-lens-knowledge"
    verification: "Feature acceptance criteria and repository tests"
    required_when: "While the contact-lens feature is active"

  - id: "adr-0001-contact-lens-knowledge"
    path: "docs/adr/0001-contact-lens-knowledge-and-matching.md"
    title: "Contact-lens knowledge catalog and explainable matching architecture"
    authority: "Accepted architectural decision"
    status: "accepted"
    update_policy: "Do not rewrite the decision; supersede it with a new ADR when governing architecture changes"
    triggers:
      - "catalog storage architecture replacement"
      - "matching model replacement"
      - "provenance or versioning architecture replacement"
    dependencies:
      - "project-context"
      - "contact-lens-feature"
    verification: "Implementation evidence listed in the ADR verification section"
    required_when: "Contact-lens catalog or matching is implemented"

  - id: "adr-0002-knowledge-private-runtime"
    path: "docs/adr/0002-knowledge-packages-and-private-clinical-runtime.md"
    title: "Knowledge packages and private clinical runtime"
    authority: "Accepted architectural decision"
    status: "accepted"
    update_policy: "Preserve history; Follow-up module ownership is partially superseded by ADR-0003; supersede remaining decisions with a later ADR if Knowledge, Clinic, privacy, or execution boundaries change"
    triggers:
      - "patient data proposed for Knowledge"
      - "clinical runtime or storage implemented"
      - "knowledge package format implemented"
      - "platform module boundary changes"
    dependencies:
      - "project-context"
      - "contact-lens-feature"
      - "adr-0001-contact-lens-knowledge"
    verification: "Verify Knowledge payloads, package schemas, private runtime flows, protocol fixtures and clinical-safety behavior"
    required_when: "Knowledge packages, clinical runtime, CRM/Orders integration, or protocol execution is designed or implemented"

  - id: "adr-0003-cross-module-follow-up"
    path: "docs/adr/0003-cross-module-follow-up.md"
    title: "Cross-module Follow-up capability"
    authority: "Accepted architectural and product decision"
    status: "accepted"
    update_policy: "Preserve history; supersede with a later ADR if Follow-up domain ownership, cross-module semantics, activation model, or initial module boundary changes"
    triggers:
      - "Follow-up technical architecture is selected"
      - "Follow-up domain ownership or module boundary changes"
      - "Follow-up lifecycle or activation semantics change"
      - "implementation expands beyond LOM"
    dependencies:
      - "project-context"
      - "project-overview"
      - "adr-0002-knowledge-private-runtime"
    verification: "Review domain semantics and LOM-only scope; verify future implementation against code, schema, event, permission and lifecycle tests"
    required_when: "Follow-up is designed or implemented in any Dr. Mate module"

  - id: "clinical-platform-foundation"
    path: "docs/features/clinical-platform-foundation.md"
    title: "Clinical platform foundation"
    authority: "Accepted product direction with explicitly proposed clinical contracts"
    status: "planned"
    update_policy: "Update after accepted clinical workflow, schema, privacy, protocol, implementation, or validation changes"
    triggers:
      - "clinical observation contract accepted"
      - "protocol runner implemented"
      - "washout assessment reviewed or changed"
      - "clinical runtime privacy boundary changes"
    dependencies:
      - "project-overview"
      - "adr-0001-contact-lens-knowledge"
      - "adr-0002-knowledge-private-runtime"
    verification: "Trace intent to accepted decisions and implementation to schema, fixtures, protocol explanations, safety and privacy tests"
    required_when: "Private clinical runtime or explainable protocols are planned, designed or implemented"

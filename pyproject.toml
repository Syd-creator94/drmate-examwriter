[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drmate-examwriter"
version = "0.1.0"
description = "Ophthalmology workflow prototype with ExamWriter rendering and a contact-lens reference catalog."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "playwright>=1.45.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<2",
    "mypy>=1.17,<2",
    "pytest>=8.2.0",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0.12",
]
fallback-pdf = [
    "weasyprint>=69.0",
]
reportlab-pdf = [
    "reportlab>=5.0.0",
]

[project.scripts]
drmate-examwriter = "dr_mate_cli:main"
drmate-lenses = "dr_mate_contact_lenses.web:main"
drmate-clinic-demo = "dr_mate_clinic_prototype.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dr_mate_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dr_mate_clinic_prototype = ["static/*.html", "static/*.css", "static/*.mjs", "static/*.svg"]
dr_mate_rendering = ["py.typed"]
dr_mate_contact_lenses = [
    "web_static/*.css",
    "web_static/*.html",
    "web_static/*.js",
    "web_static/*.png",
]

[tool.setuptools.data-files]
"share/drmate/knowledge/contact_lenses/sources" = [
    "knowledge/contact_lenses/sources/*.yaml",
]
"share/drmate/knowledge/contact_lenses/products/xcel" = [
    "knowledge/contact_lenses/products/xcel/*.yaml",
]
"share/drmate/knowledge/contact_lenses/rules/xcel" = [
    "knowledge/contact_lenses/rules/xcel/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
